name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * 1'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and real data
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -e './backend[dev]'
      - run: backend/.venv/bin/ruff check backend
      - run: backend/.venv/bin/ruff format --check backend
      - run: backend/.venv/bin/mypy --config-file backend/pyproject.toml backend/app
      - name: Complete deterministic and Yahoo regression suite
        working-directory: backend
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: .venv/bin/python -m pytest

  frontend:
    name: UI and production integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv backend/.venv
      - run: backend/.venv/bin/python -m pip install -e './backend[dev]'
      - run: npm ci
        working-directory: frontend
      - name: Generated API contract is current
        working-directory: frontend
        run: |
          ../backend/.venv/bin/python scripts/generate_api_types.py
          git diff --exit-code -- src/api/generated.ts src/api/generated.schema.json src/api/generated.exports.json
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Production FastAPI static serving and Basic Auth smoke
        run: npm run test:production-smoke
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Complete browser regression suite
        run: npm run test:e2e
        working-directory: frontend
      - name: Real production backend, default Yahoo workflow and reload
        run: npm run test:e2e:live
        working-directory: frontend
